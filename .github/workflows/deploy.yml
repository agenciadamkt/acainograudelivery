name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🔔 Checkout do Código
        uses: actions/checkout@v4

      - name: ⚙️ Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Instalar Dependências
        run: npm install

      - name: 🏗️ Criar Build de Produção
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_META_APP_ID: '1086622103852064'
          VITE_META_WHATSAPP_CONFIG_ID: '1103489992138559'
          VITE_META_GRAPH_API_VERSION: 'v26.0'

      - name: 📂 Sincronizar Arquivos via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/    # Envia APENAS a pasta de build
          server-dir: ./        # Como o usuário FTP 'acainograudelivery' já cai na public_html, usamos a raiz './'
