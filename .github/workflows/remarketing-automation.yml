name: Remarketing Automation

on:
  schedule:
    # Executa a cada hora no minuto 0
    - cron: '0 * * * *'
  # Permite execução manual para testes
  workflow_dispatch:

jobs:
  run-remarketing:
    runs-on: ubuntu-latest
    
    steps:
      - name: Execute Remarketing Edge Function
        run: |
          curl -X POST \
            'https://sixzfcpdjtnftacuwvph.supabase.co/functions/v1/remarketing-automation' \
            -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}' \
            -d '{}'
      
      - name: Log Execution
        run: |
          echo "✅ Remarketing automation executed at $(date)"
