<div id="error-log" style="position:fixed;top:0;left:0;width:100%;height:100%;background:red;color:white;z-index:9999;padding:20px;overflow:auto;display:none;"></div>
<script>
window.addEventListener('error', function(e) {
  if (e.message && (e.message.includes('ResizeObserver') || e.message.includes('Resize observer'))) {
    return;
  }
  var el = document.getElementById('error-log');
  el.style.display = 'block';
  el.innerHTML += '<p>' + e.message + '<br>' + e.filename + ':' + e.lineno + '</p>';
});
window.addEventListener('unhandledrejection', function(e) {
  var el = document.getElementById('error-log');
  el.style.display = 'block';
  el.innerHTML += '<p>Promise Rejection: ' + e.reason + '</p>';
});
</script>
