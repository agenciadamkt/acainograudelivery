[functions.mercadopago-webhook]
# O Mercado Pago chama a notification_url SEM JWT do Supabase. Sem esta linha,
# o gateway responde 401 antes do código rodar e o PIX nunca é confirmado
# automaticamente. A segurança do endpoint vem da re-consulta à API do MP
# dentro da função (nunca confia só no payload do webhook).
verify_jwt = false

[functions.infinitepay-webhook]
verify_jwt = false

[functions.whatsapp-webhook]
verify_jwt = false

[functions.whatsapp-notification]
verify_jwt = false

[functions.send-customer-push]
verify_jwt = false
[functions.copilot-chat]
enabled = true
verify_jwt = true
import_map = "./functions/copilot-chat/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/copilot-chat/index.ts"
